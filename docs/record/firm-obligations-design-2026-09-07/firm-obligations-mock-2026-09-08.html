<style>/* ===== The product's own tokens (src/index.css at 8f7467b, verbatim values) — the ruling is "under the current tokens" ===== */
:root {
  --navy: #1b2a41; --navy-2: #24374f; --accent: #b08d3e; --bg: #f5f6f8; --card: #ffffff; --line: #dde2e9;
  --text: #1d2433; --muted: #66707f; --ok: #2e7d4f; --warn: #b3541e;

}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--wb-bg); color: var(--wb-ink); }
body { font-size: 14px; line-height: 1.45; }

code, .id { font-family: var(--mono); font-size: 0.92em; }
button { font-family: inherit; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ===== workbench frame ===== */
.wb { display: grid; grid-template-columns: 212px minmax(0, 1fr) 352px; grid-template-rows: auto minmax(0, 1fr); min-height: 100vh; }

.wb-head .ctl { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--wb-muted); }

.wb-rail button { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; padding: 7px 9px; border-radius: 6px; cursor: pointer; font-size: 12.5px; color: var(--wb-ink); line-height: 1.3; }

<script>/* firm-obligations mock — DOMAIN LOGIC (spec: docs/specs/firm-obligations-module-spec.md §3–§4 at HEAD 8f7467b)
   Pure functions over naive local YYYY-MM-DD dates (FOD-3). No timers, no clock reads: `today` is always an argument.
   Every behaviour here is the spec AS WRITTEN unless a FOM- switch in `opts` selects a PROPOSED alternative
   (the companion doc names each). Runs in the browser and under node (see test/domain.test.js).
   Revised 2026-09-08 after the adversarial audit: undo gated on FOD-7's own condition and on the occurrence a close
   materialized; retire never hides a lit occurrence (FOD-8); FOD-1's weekend exemption; one-time retires itself;
   the card's horizon; quarterly labels by the rule's own order; interval kinds never serial. */
(function (root) {
  'use strict';
  var DAY = 86400000;
  function parseD(s) { var p = s.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
  function fmtD(ms) { return new Date(ms).toISOString().slice(0, 10); }
  function addDays(s, n) { return fmtD(parseD(s) + n * DAY); }
  function daysBetween(a, b) { return Math.round((parseD(b) - parseD(a)) / DAY); }
  function ymd(s) { var p = s.split('-').map(Number); return { y: p[0], m: p[1], d: p[2] }; }
  function lastDay(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }            // m is 1-based
  function mk(y, m, d) { return fmtD(Date.UTC(y, m - 1, Math.min(d, lastDay(y, m)))); }  // clamps Feb 29 etc.
  function dow(s) { return new Date(parseD(s)).getUTCDay(); }                              // 0 = Sunday

<script>window.SHEET = {"d0": {"html": "<p><b>DECISION 0 — <code>Q-FO-0</code> — THE WORD (SPEC §2)</b></p>\n<p><b>Question.</b> The record already uses \"firm deadline\" for <code>FC-7</code>'s MATTER-scoped internal-buffer track (<i>\"'Firm deadlines' are those that are set by the firm\"</i>, his words 2026-08-18). <code>FO-1</code>'s scope — bar dues, MCLE, the TIDC report, the restore test — is something else. The spec proposes <b>\"firm obligation\"</b> for the new scope and never \"firm deadline\". <b>Is \"firm obligation\" the word, or does he prefer another?</b></p>\n<p><b>Starting points (Claude's lean first).</b> (1) \"Firm obligations\" — it is the phrase he used at <code>#137</code>; (2) \"Practice obligations\"; (3) \"Office obligations\"; (4) a word of his own, or \"obligations\" alone with the firm/matter split carried by the page.</p>\n<p><b>What the answer changes.</b> The nav label (<code>FOD-12</code>, <code>/firm/obligations</code> → \"Obligations\"), the card title, the table names' prefix, every heading in the spec.</p>\n<p class=\"small muted\"><b>Michael:</b> <span style=\"display:inline-block;min-width:120px;border-bottom:1px solid #999\">&nbsp;</span></p>"}, "d1": {"html": "<p><b>DECISION 1 — <code>Q-FO-2</code>(a) and (c) — THE CLOSES (SPEC §3.3, §4.2)</b></p>\n<p><b>Question.</b> Each obligation has exactly ONE current occurrence, and it closes in only two ways: <b>Done</b> (date + optional note + where the proof is), or — ONLY on obligations whose duty can lapse for a period (no wages this year → no W-2; no tax owed → no franchise report) — <b>Not applicable this period</b>, with a required reason. Undo within the period. On bar dues, MCLE, the practice-time report, the PIR, insurance, there is no \"not applicable\" at all: Done or Retire. No snooze, no \"later\", no dismiss, no bulk action. <b>Is that the behaviour he wants — and is there a THIRD state he uses in practice (<i>\"delegated to &lt;person&gt;, waiting\"</i>) that should mark an open occurrence without closing it?</b></p>\n<p><b>Starting points (Claude's lean first).</b> (1) As drafted — two closes, \"not applicable\" only where the duty can lapse; (2) as drafted PLUS a \"delegated — waiting on &lt;person&gt;\" marker that is NOT a close and stays lit, showing who has it (a future paralegal might be the one who files the PIR); (3) something adjacent — e.g., \"Done\" should always ask for a confirmation number on filings; or he never wants \"not applicable\" and would rather retire and re-add; or another shape of his.</p>\n<p><b>What the answer changes.</b> The <code>outcome</code>/<code>outcomeReason</code> enums and the <code>conditionalPerPeriod</code> flag (SPEC §3.3), <code>FOD-18</code>, <code>FOD-19</code>, the register's buttons; option (2) adds an <code>assignee</code> axis (SPEC §10).</p>\n<p class=\"small muted\"><b>Michael:</b> <span style=\"display:inline-block;min-width:120px;border-bottom:1px solid #999\">&nbsp;</span></p>"}, "d2": {"html": "<p><b>DECISION 2 — <code>Q-FO-2</code>(b) — WHAT A MISSED PERIOD DOES (SPEC §4.1)</b></p>\n<p><b>Question.</b> A filing missed for a period stays a real missed filing: finishing the 2025 practice-time report in 2027 produces the 2026 occurrence already overdue, and so on until he is current (<b>serial</b>). A cadence — the monthly trust reconciliation, the backup heartbeat review — does NOT manufacture a backlog: a reconciliation done in September reconciles to date, and the next occurrence is the next future month (<b>collapse</b>). <code>FO-2</code> says the current duty stays lit; the spec reads it as not saying the software invents past ones. <b>Is that split right, and is the default assignment (filings serial; cadences collapse) right?</b></p>\n<p><b>Starting points (Claude's lean first).</b> (1) As drafted; (2) serial for everything — every missed period is a row until he clears it; (3) collapse for everything — only the current period is ever lit; (4) a per-obligation choice with a different default than the spec's, or a composite of his.</p>\n<p><b>What the answer changes.</b> <code>missedPeriods</code> and its defaults; <code>FOD-5</code>.</p>\n<p class=\"small muted\"><b>Michael:</b> <span style=\"display:inline-block;min-width:120px;border-bottom:1px solid #999\">&nbsp;</span></p>"}, "d3": {"html": "<p><b>DECISION 3 — <code>Q-FO-1</code> — WHERE IT LIVES — Claude's recommendation, for confirmation (SPEC §6)</b></p>\n<p><b>Recommendation.</b> Two new tables — <code>firm_obligations</code> and <code>firm_obligation_occurrences</code>, RLS/policy/GRANT/probe in the same commit, store v17 on the demo side — rather than widening <code>calendar_events</code> (making <code>case_id</code> nullable and adding a <code>scope</code>). <b>Nothing is migrated by the answer; it shapes the slice.</b> Reason: <code>calendar_events.case_id</code> has been <code>NOT NULL</code> since the 2026-07-24 Outlook build and every reader relies on it; an occurrence has done/outcome/next-materialization semantics a calendar event does not; and this chooses against the literal reading of <code>FO-1</code>'s <i>\"a new SCOPE, not a new type\"</i> because the matter side of that one-model reading is the unbuilt deadline engine. <b>Does he confirm the recommendation, or does he see the storage the other way?</b> (This is an engineering call put for his confirmation — the <code>#149</code> limb-3 shape — not a workflow question.)</p>\n<p><b>Starting points (Claude's lean first).</b> (1) Two tables (the recommendation); (2) widen <code>calendar_events</code>; (3) two tables now, a read-only projection into a firm-wide calendar list later, if one is built; (4) his own shape.</p>\n<p class=\"small muted\"><b>Michael:</b> <span style=\"display:inline-block;min-width:120px;border-bottom:1px solid #999\">&nbsp;</span></p>"}, "d4": {"html": "<p><b>DECISION 4 — <code>Q-FO-3</code> — <code>FO-5</code>: PER-FIRM OR PER-ATTORNEY, AND WHO DOES THE WORK (SPEC §10)</b></p>\n<p><b>Question.</b> CLE, dues and the practice-time report are per licensee; the PIR, insurance and the backups are the firm's. Today both are him. <b>Does the register carry an owner scope from the first migration (<code>firm</code> / <code>attorney</code>, changing nothing on screen at the solo stage, fanning out per licensed user at multi-user), or wait until there is a second user?</b> And, if DECISION 1 took the delegated marker: <b>is WHO DOES IT (an assignee — a future paralegal filing the PIR) modelled now, or at multi-user?</b></p>\n<p><b>Starting points (Claude's lean first).</b> (1) The owner-scope field now; the assignee axis at multi-user; (2) no field until the multi-user phase; (3) per-user for everything (rejected as the lean because insurance and the PIR are not per-user); (4) both axes now, or his own split.</p>\n<p><b>What the answer changes.</b> Two columns now or later; at multi-user, that Done on an <code>attorney</code>-scoped obligation needs the owner or the attorney role (a gate-2 item either way).</p>\n<p class=\"small muted\"><b>Michael:</b> <span style=\"display:inline-block;min-width:120px;border-bottom:1px solid #999\">&nbsp;</span></p>"}, "d5": {"html": "<p><b>DECISION 5 — <code>Q-FO-4</code> — <code>FO-7</code>: DOES <code>FO-3</code>'S QUICKBOOKS LIMB FIRE? (SPEC §9)</b></p>\n<p><b>Question.</b> The limb fires only <i>\"IF a QuickBooks integration is genuinely in the build or spec'd\"</i>, verified at HEAD. At <code>ea5675b</code>: <b>no QuickBooks code or table exists in <code>src/</code>, <code>db/</code> or <code>supabase/</code>; a research memo exists</b> (<code>qbo-integration-research-memo-2026-08-15.md</code>, PROPOSED — RESEARCH ONLY) and records that Intuit offers no read-only scope. <b>On those two facts, is the register built THIN with no hook — a confirmation number and a \"filed at\" pointer being the only money-adjacent fields — with any later QuickBooks slice adding its own <code>ledgerRef</code> column?</b> Whether a research memo is \"spec'd\" in the sense he meant is his call (runner 82's words: <i>\"being his call\"</i>).</p>\n<p><b>Starting points (Claude's lean first).</b> (1) Thin, no hook; <code>FO-7</code> closes on the two facts; (2) thin, but reserve a nullable <code>externalRef</code> column now; (3) the memo counts as \"spec'd\" — the limb fires and the slice carries an expense-side hook designed against the memo (heavier; <code>Q-QBO-2</code>'s no-read-only-scope finding applies); (4) his own reading of the condition.</p>\n<p><b>What the answer changes.</b> One nullable column, and whether <code>FO-7</code> closes.</p>\n<p class=\"small muted\"><b>Michael:</b> <span style=\"display:inline-block;min-width:120px;border-bottom:1px solid #999\">&nbsp;</span></p>"}, "d6": {"html": "<p><b>DECISION 6 — <code>Q-FO-6</code> — WEIGHT (SPEC §4.4)</b></p>\n<p><b>Question.</b> Two classes — <code>hard</code> (licence, filing, insurance, and whatever he calls <i>\"do or die\"</i>) and <code>routine</code> (cadences, memberships) — affecting ORDER and EMPHASIS only, never behaviour; or one class and date order alone? <b>And a composite worth naming: routine items live on the register only and never on the dashboard card.</b></p>\n<p><b>Starting points (Claude's lean first).</b> (1) Two classes, routine on the register only (the composite); (2) two classes, both on the card; (3) one class; (4) his own line.</p>\n<p><b>What the answer changes.</b> One enum column; the card's sort and contents; nothing else. (Which ROWS are hard is DECISION 9's business — his <code>#137</code> words named four items; every other weight in the catalog is Claude's call, and DECISION 9 Part B says so row by row.)</p>\n<p class=\"small muted\"><b>Michael:</b> <span style=\"display:inline-block;min-width:120px;border-bottom:1px solid #999\">&nbsp;</span></p>"}, "d7": {"html": "<p><b>DECISION 7 — <code>Q-FO-5</code> — OUTLOOK: THE OBJECT, THE CALENDAR, THE REMINDER (SPEC §5.3)</b></p>\n<p><b>Question.</b> The app has no channel of its own — nothing reaches him unless he opens a page — so Outlook is the only surface that can make a lead window FELT. An all-day event on the due date fires the evening before and then scrolls into the past; a To Do task stays overdue until completed on every Outlook surface including the phone, but needs a new consent (<code>Tasks.ReadWrite</code>) on the registration, which today holds <code>Calendars.ReadWrite</code> alone. Outlook mobile toggles CALENDARS cleanly and filters CATEGORIES poorly. <b>Does he want occurrences pushed at all, and if so as what, where, with what reminder?</b></p>\n<p><b>Starting points (Claude's lean first).</b> (1) An all-day event on the due date in a SEPARATE dedicated calendar (\"MDBP Firm\"), subject <i>\"Firm obligation: &lt;name&gt; (&lt;period&gt;)\"</i>, with <code>isReminderOn</code> and the reminder set to the lead window; (2) a To Do task, granting the new scope; (3) the same \"MDBP Cases\" calendar with a <code>MDBP Firm</code> category; (4) no push — the register and the card are enough; (5) a composite — e.g., event AND task, or a separate calendar with the reminder at seven days rather than the lead — or his own.</p>\n<p><b>What the answer changes.</b> The no-case <code>toGraphEvent</code> variant; whether the occurrence table carries the four sync fields; a consent act if (2). Keep-vs-delete on done is HELD for his Outlook (foot of this sheet).</p>\n<p class=\"small muted\"><b>Michael:</b> <span style=\"display:inline-block;min-width:120px;border-bottom:1px solid #999\">&nbsp;</span></p>"}, "d8": {"html": "<p><b>DECISION 8 — <code>Q-FO-7</code> — THE REGISTRY BOUNDARY (SPEC §8)</b></p>\n<p><b>Question.</b> The seed catalog rests on practice-of-law and practice-administration propositions (Tex. Gov't Code §§ 81.054, 81.113, 81.114, 79.036(a-1), 406.002, 406.010; Estates Code §§ 1054.201–.203; Code Crim. Proc. art. 26.04(j)(4); TDRPC 1.15(a); Tax Code §§ 171.002(d), 171.202, 171.2022, 171.203, 171.204(b), 171.2515, 22.01, 22.23, 22.28, 31.02, 151.0101; Bus. &amp; Com. Code §§ 71.103, 71.151; Labor Code §§ 406.004–.005; Health &amp; Safety Code § 181.101). The registry has, in BUILD-STATE's words, carried <i>\"the firm's CASES, not its PRACTICE\"</i>, and <i>\"the cases-vs-practice boundary stays UNDECIDED\"</i>. <b>Do these enter the registry as UNVERIFIED entries in a NEW file, <code>legal-rule-registry-firm-obligations.md</code>, with each template's source note pointing at its entry — or stay as source notes on the templates and out of the registry?</b></p>\n<p><b>Starting points (Claude's lean first).</b> (a) Registry entries, new file, drafts by a later Opus act, each entering UNVERIFIED — the module puts a statute-backed date on his screen; (b) source notes only; (c) entries in an existing file rather than a new one (which one is then a second question); (d) his own boundary.</p>\n<p><b>What the answer changes.</b> Whether a drafting act is queued; the <code>sourceNote</code> field's meaning.</p>\n<p class=\"small muted\"><b>Michael:</b> <span style=\"display:inline-block;min-width:120px;border-bottom:1px solid #999\">&nbsp;</span></p>"}, "d9": {"html": "<p><b>DECISION 9 — <code>Q-FO-9</code> and <code>Q-FO-8</code> — ACQUISITIONS, CHANNELS, AND WHICH TEMPLATES (SPEC §7, §7.8)</b></p>\n<p><b>Part A — acquisitions and channels (his hand, permanently).</b> Five things the catalog wants and the Knowledge Repo does not hold: <b>(1) the State Bar Rules</b> (Art. III membership/dues; Art. XII MCLE) with the <b>MCLE Regulations</b>; <b>(2) the Rules Governing the Operation of the Texas Access to Justice Foundation</b> (IOLTA); <b>(3) the Family Code zip</b> (already the acquisition list's recommended minimum); <b>(4) the indigent-defense plan(s)</b> for the counties whose lists he is on — public documents outside the four channels; <b>(5) a federal-statute channel</b> (the Office of the Law Revision Counsel / govinfo.gov) for the estimated-tax and return dates. <b>Which does he want, and are (4) and (5) new SOURCING channels (a trigger-3 amendment each) or per-instance reads?</b></p>\n<p><b>Starting points (Claude's lean first).</b> (1) All five, with (4) and (5) as named channels; (2) the State Bar Rules and the FA zip now, the rest when their rows are activated; (3) none yet; (4) his own set.</p>\n<p class=\"small muted\"><b>Michael:</b> <span style=\"display:inline-block;min-width:120px;border-bottom:1px solid #999\">&nbsp;</span></p>\n<p><b>Part B — the catalog, one question, not thirty.</b> <i>\"Which of these are OFFERED in the register, and which are ACTIVE at go-live?\"</i> — dates, per-period conditions and the firm facts (payroll — including himself under an S election; an assumed name; a notary commission; guardianship work; which counties' lists; which subscriptions) are entered <b>at activation, in the product</b> (<code>FOD-9</code>; <code>CC-1(b)</code>), never here. The only per-row question at the sitting is the WEIGHT: four rows carry his own <code>#137</code> words; every other weight is Claude's call, marked so, and any of them is his to change in a word. His answer can be a list, a rule (\"everything statutory active, everything infrastructure offered\"), or a composite.</p>\n<p class=\"small muted\"><b>Michael:</b> <span style=\"display:inline-block;min-width:120px;border-bottom:1px solid #999\">&nbsp;</span> (a list, a rule, or a composite)</p>\n<p class=\"small muted\">(The Part B table is rendered as the worksheet below, row for row.)</p>"}, "d10": {"html": "<p><b>DECISION 10 — <code>Q-FO-10</code> — ROWS (SPEC §1 item 9)</b></p>\n<p><b>Question.</b> <code>FO-1</code>–<code>FO-7</code> and <code>BR-3</code> have no register row; the closed register's own header says minting them is his act. <b>Mint them now</b> — <code>FO-1</code>–<code>FO-3</code> born ✅ in the closed register (<code>CAP-3</code>) with their ruling text, <code>FO-4</code> closed by the spec once DECISIONS 0–9 are ruled, <code>FO-5</code>/<code>FO-6</code>/<code>FO-7</code> ⬜ with the full question text (or ✅ if DECISIONS 4/5 close them), <code>BR-3</code> ⬜ pointing at <code>FOT-22</code> — <b>or leave them roomless?</b></p>\n<p><b>Starting points (Claude's lean first).</b> (1) Mint — <code>QR-1</code> exists because a question with no row is a question that disappears; (2) mint only the ones still open after this sitting; (3) leave roomless; (4) his own subset.</p>\n<p class=\"small muted\"><b>Michael:</b> <span style=\"display:inline-block;min-width:120px;border-bottom:1px solid #999\">&nbsp;</span></p>\n<p>---</p>"}, "held": {"html": "<p><b>NOT ON THIS SHEET — HELD FOR THE PRODUCT (<code>CC-1(b)</code>; PROPOSED for the HANDS-ON QUEUE)</b></p><p><code>FO-6</code> (already accepted onto the queue) plus the five the spec §11 proposes: the dashboard card's wording, position, line count and 14-day horizon; the register's twelve-month view and the shape of the Done / Not-applicable affordances; Outlook as seen in his Outlook — separate calendar vs the same, the subject, keep-with-\"Done — \"-prefix vs delete, the reminder at the lead window, the To Do route if he grants the scope; whether a firm-wide calendar page should exist and whether firm obligations should be visible-but-filtered on a case's Calendar tab; lead-window defaults once he has felt one. <b>Gate: the module on fixtures in demo mode.</b> Claude calls the sitting unprompted when that gate opens (<code>CC-1(c)</code>).</p>\n<p><b>NOT ON THIS SHEET — THE SLICE</b></p><p>The build slice and its kickoff prompt are drafted AFTER DECISIONS 0–10, put whole, broken into limbs at his instruction, and authorized (or not) in their own act. Nothing on this sheet is a build authorization.</p>"}};
window.WS_ROWS = [{"id": "FOT-1", "template": "State Bar membership fee (+ the $65 legal services fee as a note)", "weight": "hard", "source": "his <code>#137</code> set (bar dues)"}, {"id": "FOT-2", "template": "MCLE compliance", "weight": "hard", "source": "his <code>#137</code> set (CLE hours)"}, {"id": "FOT-3", "template": "Guardianship certification (2 yrs, then 4)", "weight": "hard", "source": "Claude's call (conditional row)"}, {"id": "FOT-4", "template": "TIDC practice-time report — Oct 15", "weight": "hard", "source": "Claude's call"}, {"id": "FOT-5", "template": "Appointment-list eligibility (per the county plan)", "weight": "hard", "source": "Claude's call (conditional row)"}, {"id": "FOT-6", "template": "Trust-account reconciliation (monthly, a practice cadence)", "weight": "<b>hard</b>", "source": "his <code>#137</code> set (IOLTA reconciliation) — the spec first drafted <code>routine</code> on the source-of-law ground and moved it to <code>hard</code> on his words; his to settle"}, {"id": "FOT-7", "template": "IOLTA certification (inactive until the rules are read)", "weight": "hard", "source": "Claude's call"}, {"id": "FOT-8", "template": "Franchise tax annual report — May 15 (per-period condition)", "weight": "hard", "source": "Claude's call"}, {"id": "FOT-9", "template": "Public Information Report — May 15 in practice", "weight": "hard", "source": "Claude's call (on the forfeiture power, § 171.2515(a); the grounds NOT READ)"}, {"id": "FOT-10", "template": "Business personal property rendition — Apr 15", "weight": "hard", "source": "Claude's call"}, {"id": "FOT-11", "template": "Property tax payment — Jan 31", "weight": "hard", "source": "Claude's call"}, {"id": "FOT-12", "template": "Assumed-name certificate renewal (10 yrs)", "weight": "hard", "source": "Claude's call (conditional row)"}, {"id": "FOT-13–FOT-18", "template": "W-2/W-3 · 941 · 940 · TWC · 1099-NEC · returns and estimates — all conditional on wages/payments", "weight": "hard", "source": "Claude's call"}, {"id": "FOT-19", "template": "Malpractice renewal", "weight": "hard", "source": "his <code>#137</code> set (malpractice renewal)"}, {"id": "FOT-20", "template": "Other coverage renewals", "weight": "hard", "source": "Claude's call"}, {"id": "FOT-21", "template": "Notary commission (4 yrs)", "weight": "routine", "source": "Claude's call (conditional row)"}, {"id": "FOT-22–FOT-24", "template": "Documents restore test · database restore test · backup heartbeat review", "weight": "routine", "source": "Claude's call (<code>BR-3</code>, the origin case)"}, {"id": "FOT-25", "template": "Firm payment card expiry", "weight": "<b>hard</b>", "source": "Claude's call"}, {"id": "FOT-26", "template": "Annual closed-file and records review", "weight": "routine", "source": "Claude's call"}, {"id": "FOT-27", "template": "Domain renewal", "weight": "hard", "source": "Claude's call"}, {"id": "FOT-28", "template": "Subscription renewals (Supabase, Postmark, M365, CloudLex)", "weight": "<b>routine</b>", "source": "Claude's call (they bill automatically)"}, {"id": "FOT-29–FOT-30", "template": "Legal-research renewal notice window · office lease notice", "weight": "hard", "source": "Claude's call"}, {"id": "FOT-31", "template": "County / specialty bar memberships", "weight": "routine", "source": "Claude's call"}, {"id": "FOT-32–FOT-34", "template": "LegiScan key rotation · model-credential rotation · DMARC (all inactive, undated)", "weight": "hard / hard / routine", "source": "Claude's call"}, {"id": "FOT-35", "template": "Security risk analysis", "weight": "routine", "source": "Claude's call"}, {"id": "—", "template": "BOI report", "weight": "inactive with the note", "source": "—"}];

<script>/* firm-obligations mock — UI. Renders the three surfaces (spec §5) under the spec's defaults, with the eleven DECISIONS

(function () {
  'use strict';
  var FO = window.FO, FX = window.FO_FIXTURE, SHEET = window.SHEET || {}, WS_ROWS = window.WS_ROWS || [];
  function h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function store(k, v) { try { if (v === undefined) { var r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

  /* ---------- state ---------- */
  var S = {
    fixture: 'backlog', today: null, screen: 'register', decision: 0, multiUser: false, hl: null, expanded: {}, form: null,
    d: { d0: 1, d0custom: '', d1: 1, d2: 1, d3: 1, d4: 1, d5: 1, d6: 1, d7: 1, d8: 'a', d10: 1 },
    fom: { collapsePeriod: false, precisionEarlier: false, pinHardFirst: false, perPeriodFlags: false, cardWindowLiteral: false },
    cardAbove: false,
    ws: {}, data: null
  };
  var saved = store('fo-mock-state-v1'); if (saved && saved.d) { S.d = Object.assign(S.d, saved.d); S.fom = Object.assign(S.fom, saved.fom || {}); S.ws = saved.ws || {}; }
  function persist() { store('fo-mock-state-v1', { d: S.d, fom: S.fom, ws: S.ws }); }

  function loadFixture(name, keepToday) { S.fixture = name; S.data = FX.buildFixture(name); if (!keepToday) S.today = S.data.today; S.expanded = {}; S.form = null; }
  loadFixture('backlog');

  /* ---------- decision effects ---------- */
  function word() { var m = { 1: 'Firm obligations', 2: 'Practice obligations', 3: 'Office obligations' }; return S.d.d0 == 4 ? (S.d.d0custom || 'Obligations') : m[S.d.d0]; }
  function navLabel() { var w = word().trim().split(/\s+/); var last = w[w.length - 1]; return last.charAt(0).toUpperCase() + last.slice(1); }
  function opts() {
    return { cardBothWeights: S.d.d6 == 2, oneWeightClass: S.d.d6 == 3, fomCollapsePeriod: S.fom.collapsePeriod, fomPrecisionEarlier: S.fom.precisionEarlier, cardWindowRegardlessOfLead: S.fom.cardWindowLiteral, cardHorizonDays: 14 };
  }
  function effMissed(ob) { if (ob.kind === 'interval-from-completion') return 'collapse'; /* by construction (§3.2) */ if (S.d.d2 == 2) return 'serial'; if (S.d.d2 == 3) return 'collapse'; return ob.missedPeriods; }
  function withEff(ob) { var c = Object.create(ob); c.missedPeriods = effMissed(ob); c.conditionalPerPeriod = ob.conditionalPerPeriod || (S.fom.perPeriodFlags && ['FOT-10','FOT-11','FOT-15','FOT-16'].indexOf(ob.id) >= 0); return c; }
  function outlookMode() { return { 1: 'event-separate', 2: 'todo', 3: 'event-same-category', 4: 'none', 5: 'both' }[S.d.d7]; }
  function showsNA(ob) { return ob.conditionalPerPeriod && S.d.d1 != '3b'; }
  function hasDelegate() { return S.d.d1 == 2 || S.d.d4 == 4; }
  function isFiling(ob) { return ob.category === 'court-appointments' || ob.category === 'tax-entity-and-employment'; }
  function ownerScopeModelled() { return S.d.d4 != 2; }

      case 'catalog': S.form = { kind: 'catalog' }; break;
      case 'activate': {
        var oba = S.data.obligations[obId];
        if (oba.activatedInFixture && S.data.occurrences.some(function (o) { return o.obligationId === obId && o.state === 'open'; })) { oba.active = true; log({ entityType: 'firm_obligation', entityId: obId, action: 'edited', at: S.today, note: 'Un-retired — the open occurrence was never closed by the retirement (FOD-8)' }); break; }
        S.form = { kind: 'activate', ob: obId }; break;
      }
      case 'retire': { var o2 = S.data.obligations[obId]; o2.active = false; log({ entityType: 'firm_obligation', entityId: obId, action: 'edited', at: S.today, note: 'Retired — the open occurrence stays lit until done (FOD-8); no next materializes' }); break; }
      case 'undo': {
        var nx = nextFor(oc);
        try { var r = FO.undo(ob, oc, nx, S.today, !!nextOf(oc)); if (r.deletedNext && nx) S.data.occurrences = S.data.occurrences.filter(function (o) { return o.id !== nx.id; }); if (S.data.obligations[oc.obligationId].kind === 'one-time') { S.data.obligations[oc.obligationId].active = true; } log(r.log); syncNote(oc, 'reverted'); }
        catch (e) { log({ entityType: 'firm_obligation_occurrence', entityId: oc.id, action: 'refused', at: S.today, note: e.message }); }
        break;
      }
      case 'submit': submitForm(); break;
      case 'submit-activate': submitActivate(obId); break;
    }
    render();
  }
  function syncNote(oc, what) { oc.syncStatus = what; }
  function submitForm() {
    var f = S.form, root = $('.exp .form') || $('#activate'); if (!f || !root) return;
    var oc = occ(f.oc), ob = withEff(S.data.obligations[oc.obligationId]); var v = function (n) { var e = root.querySelector('[name="' + n + '"]'); return e ? e.value.trim() : ''; };
    try {
      if (f.kind === 'done') {
        if (S.d.d1 == '3a' && isFiling(ob) && !v('confirmation')) throw new Error('a confirmation number is required on a filing (DECISION 1 option 3)');
        var r = FO.markDone(ob, oc, { today: S.today, doneOn: v('doneOn') || S.today, doneNote: [v('doneNote'), v('confirmation') ? 'conf. ' + v('confirmation') : ''].filter(Boolean).join(' · '), filedAt: v('filedAt'), externalRef: v('externalRef') }, opts());
        if (r.next) { S.data.occurrences.push(r.next); log({ entityType: 'firm_obligation_occurrence', entityId: r.next.id, action: 'created', at: S.today, note: 'Next occurrence materialized: ' + r.next.periodLabel + ', due ' + r.next.dueOn + ' (' + ob.missedPeriods + ')' }); }
        if (r.retiresObligation) { S.data.obligations[oc.obligationId].active = false; log({ entityType: 'firm_obligation', entityId: oc.obligationId, action: 'edited', at: S.today, note: 'One-time obligation done — retires itself (§3.2); history stays in Inactive' }); }
        log(r.log);
      } else if (f.kind === 'na') {
        var r2 = FO.markNotApplicable(ob, oc, { today: S.today, outcomeReason: v('outcomeReason'), doneNote: v('doneNote') }, opts());
        if (r2.next) { S.data.occurrences.push(r2.next); log({ entityType: 'firm_obligation_occurrence', entityId: r2.next.id, action: 'created', at: S.today, note: 'Next occurrence materialized: ' + r2.next.periodLabel + ', due ' + r2.next.dueOn }); }
        if (r2.retiresObligation) { S.data.obligations[oc.obligationId].active = false; }
        log(r2.log);
      } else if (f.kind === 'delegate') {
        if (!v('delegatedTo')) throw new Error('name who has it');
        oc.delegatedTo = v('delegatedTo'); log({ entityType: 'firm_obligation_occurrence', entityId: oc.id, action: 'edited', at: S.today, note: 'Delegated to ' + oc.delegatedTo + ' — still open, still lit' });
      } else if (f.kind === 'edit') {
        var base = S.data.obligations[oc.obligationId], lead = parseInt(v('leadDays'), 10);
        if (isNaN(lead) || lead < 0) throw new Error('the lead is a number of days');
        var wasLead = base.leadDays, wasW = base.weight; base.leadDays = lead; base.weight = v('weight') || base.weight;
        log({ entityType: 'firm_obligation', entityId: base.id, action: 'edited', at: S.today, note: 'Lead ' + wasLead + ' → ' + lead + ' days; weight ' + wasW + ' → ' + base.weight + ' — the open occurrence re-evaluated (FOD-4)' });
      } else if (f.kind === 'override') {
        var r3 = FO.applyOverride(ob, oc, v('newDate'), S.today);
        if (!r3.applied) throw new Error('refused — ' + r3.reason);
        log(r3.log);
      }
      S.form = null;
    } catch (e) { f.error = e.message; }
  }
  function submitActivate(obId) {
    var ob = S.data.obligations[obId], root = $('#activate'); var v = function (n) { var e = root.querySelector('[name="' + n + '"]'); return e ? e.value.trim() : ''; };
    try {
      if (ob.kind === 'anniversary') { if (!v('anchorDate')) throw new Error('the anchor date is yours — enter it (FOD-9)'); ob.rule.anchorDate = v('anchorDate'); }
      if (ob.kind === 'one-time') { if (!v('dueOn')) throw new Error('the date is yours — enter it (FOD-9)'); ob.rule.dueOn = v('dueOn'); }
      if (ob.kind === 'interval-from-completion') ob.lastDone = v('lastDone') || null;
      if (v('lastPeriodDue')) ob.lastPeriodDue = v('lastPeriodDue');
      ob.active = true; ob.activatedInFixture = true;
      if (S.data.occurrences.some(function (o) { return o.obligationId === obId && o.state === 'open'; })) { S.form = null; return; }   // an open occurrence already exists: nothing materializes
      var first = FO.firstOccurrence(withEff(ob), S.today, { fomActivationLastCompleted: !!ob.lastPeriodDue });
      if (first) { S.data.occurrences.push(first); log({ entityType: 'firm_obligation', entityId: obId, action: 'created', at: S.today, note: 'Activated; first occurrence ' + first.periodLabel + ' due ' + first.dueOn }); }
      S.form = null;
    } catch (e) { S.form.error = e.message; }
  }

  /* ---------- render ---------- */
  function render() {
    var stage = $('#stage'), panel = $('#panel');
    var tabs = '<div class="stage-tabs">' + [['cases', '/cases'], ['register', '/firm/obligations'], ['outlook', 'Outlook']].map(function (t) { return '<button data-screen="' + t[0] + '" class="' + (S.screen === t[0] ? 'on' : '') + '">' + h(t[1]) + '</button>'; }).join('') + '<span class="hint">' + h(S.data.label) + ' · ' + h(S.data.note) + '</span></div>';
    stage.innerHTML = tabs + (S.screen === 'cases' ? renderCases() : S.screen === 'register' ? renderRegister() : renderOutlook());
    panel.innerHTML = decisionPanel();
    $$('.wb-rail button[data-dec]').forEach(function (b) { b.classList.toggle('on', Number(b.getAttribute('data-dec')) === S.decision); });
    $('#today').value = S.today; $('#fixture').value = S.fixture;
    if (S.hl) { var t = $('.hl-target'); if (t && t.scrollIntoView) t.scrollIntoView({ block: 'center' }); S.hl = null; }
    persist();
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act],[data-go],[data-screen],[data-dec],[data-look],#wscopy,#wsreset'); if (!el) return;
    if (el.hasAttribute('data-act')) { e.preventDefault(); act(el.getAttribute('data-act'), el); return; }
    if (el.hasAttribute('data-go')) { e.preventDefault(); var g = el.getAttribute('data-go'); S.screen = g === '/firm/obligations' ? 'register' : g === '/cases' ? 'cases' : S.screen; render(); return; }
    if (el.hasAttribute('data-screen')) { S.screen = el.getAttribute('data-screen'); render(); return; }
    if (el.hasAttribute('data-dec')) { S.decision = Number(el.getAttribute('data-dec')); render(); return; }
    if (el.hasAttribute('data-look')) { var l = el.getAttribute('data-look'); S.screen = l === 'outlook' ? 'outlook' : l === '/cases' ? 'cases' : 'register'; render(); return; }
    if (el.id === 'wscopy') { var ta = $('#wssum'); ta.select(); try { navigator.clipboard.writeText(ta.value); } catch (x) {} return; }
    if (el.id === 'wsreset') { S.ws = {}; render(); return; }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.name === 'dec') { var dec = DEC[S.decision]; if (dec.key) { S.d[dec.key] = isNaN(Number(t.value)) ? t.value : Number(t.value); if (dec.n === 1 && t.value === '3b') { S.data.occurrences.forEach(function () {}); } render(); } return; }
    if (t.id === 'd0custom') { S.d.d0custom = t.value; render(); return; }
    if (t.id === 'mu') { S.multiUser = t.checked; render(); return; }
    if (t.id === 'cardAbove') { S.cardAbove = t.checked; S.screen = 'cases'; render(); return; }
    if (t.hasAttribute('data-fom')) { S.fom[t.getAttribute('data-fom')] = t.checked; render(); return; }
    if (t.id === 'today') { if (/^\d{4}-\d{2}-\d{2}$/.test(t.value)) { S.today = t.value; render(); } return; }
    if (t.id === 'fixture') { loadFixture(t.value); render(); return; }
    if (t.name && t.name.indexOf('ws-') === 0) { var id = t.name.slice(3); S.ws[id] = S.ws[id] || {}; S.ws[id].v = t.value; $('#wssum').value = wsSummary(); persist(); return; }
    if (t.hasAttribute('data-wsw')) { var id2 = t.getAttribute('data-wsw'); S.ws[id2] = S.ws[id2] || {}; S.ws[id2].w = t.value || null; $('#wssum').value = wsSummary(); persist(); return; }
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'd0custom') { S.d.d0custom = e.target.value; $$('.sidebar nav a[data-go="/firm/obligations"]').forEach(function (a) { a.textContent = navLabel(); }); } });
  $$('[data-quick]').forEach(function (b) { b.addEventListener('click', function () { var q = b.getAttribute('data-quick'); S.today = q === 'fixture' ? S.data.today : q; render(); }); });
  render();
})();
</script>
